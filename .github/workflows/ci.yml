name: CI/CD - API Docker

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: CI - Tests et build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation de uv
        run: pip install uv

      - name: Installation des dépendances
        run: uv sync --frozen

      - name: Lancement des tests avec couverture
        run: uv run pytest --cov=src --cov-report=term-missing -v

      - name: Construction de l'image Docker
        run: docker build -t home-credit-api .

  cd:
    name: CD - Déploiement Hugging Face
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement sur Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          pip install huggingface_hub

          python - <<EOF
          from huggingface_hub import HfApi

          api = HfApi(token="${HF_TOKEN}")

          api.upload_folder(
              folder_path=".",
              repo_id=f"${HF_USERNAME}/${HF_SPACE_NAME}",
              repo_type="space",
              allow_patterns=[
                  "Dockerfile",
                  "README.md",
                  "pyproject.toml",
                  "uv.lock",
                  "src/**",
                  "models/lightgbm_final.pkl",
                  "models/model_metadata.json",
                  "data/demo/production_demo_clients.csv",
              ],
          )
          EOF